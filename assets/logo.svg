<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cinema Reel / Play Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="2.5" />
    <circle cx="40" cy="40" r="26" fill="url(#glowGrad)" fill-opacity="0.15" />
    <!-- Film reel perforations -->
    <circle cx="28" cy="28" r="4" fill="#06b6d4" />
    <circle cx="52" cy="28" r="4" fill="#06b6d4" />
    <circle cx="28" cy="52" r="4" fill="#6366f1" />
    <circle cx="52" cy="52" r="4" fill="#d946ef" />
    <!-- Play Triangle -->
    <polygon points="36,29 52,40 36,51" fill="url(#glowGrad)" />
  </g>

  <!-- Typography -->
  <text x="105" y="55" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
    CA<tspan fill="url(#glowGrad)">IC</tspan>
  </text>
  
  <text x="210" y="55" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="700" font-size="34" fill="#94a3b8" letter-spacing="1">
    CINEMA
  </text>

  <!-- Subtitle Tag -->
  <g transform="translate(106, 66)">
    <rect x="0" y="0" width="165" height="20" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1" />
    <text x="82" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">
      STREAMING & IA
    </text>
  </g>
</svg>
