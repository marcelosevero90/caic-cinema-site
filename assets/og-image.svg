<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="220" fill="#0284c7" fill-opacity="0.15" filter="blur(60px)" />
  <circle cx="1000" cy="400" r="260" fill="#7c3aed" fill-opacity="0.18" filter="blur(80px)" />

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="90" height="90" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <polygon points="40,30 65,45 40,60" fill="url(#neonText)" />
    <text x="110" y="65" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="#ffffff">
      CA<tspan fill="url(#neonText)">IC</tspan> CINEMA
    </text>
  </g>

  <!-- Title & Subtitle -->
  <text x="100" y="270" font-family="'Outfit', sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">
    O Streaming Inteligente do Futuro.
  </text>
  <text x="100" y="340" font-family="'Outfit', sans-serif" font-weight="800" font-size="50" fill="url(#neonText)">
    Com Curadoria Conversacional por IA.
  </text>

  <text x="100" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="26" fill="#94a3b8">
    Assista direto no Navegador Web ou instale o App no Android e TV Box.
  </text>
  <text x="100" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="26" fill="#94a3b8">
    Navegação suave com controle remoto e Gemini 3.8 integrado.
  </text>

  <!-- Badges Container -->
  <g transform="translate(100, 510)">
    <rect width="320" height="60" rx="16" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5" />
    <text x="160" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#ffffff" text-anchor="middle">
      🌐 caic-cinema.vercel.app
    </text>

    <rect x="350" y="0" width="300" height="60" rx="16" fill="#4c1d95" fill-opacity="0.4" stroke="#c084fc" stroke-width="1.5" />
    <text x="500" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#ffffff" text-anchor="middle">
      📲 App Android &amp; TV Box
    </text>
  </g>
</svg>
